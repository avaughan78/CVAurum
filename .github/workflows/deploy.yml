name: Deploy upstream CVAurum to GitHub Pages

# cv.hirepotential.co.uk serves the original project (akhil-dara/CVAurum) unmodified, always at
# its latest main. Every day this builds upstream's main, runs its own typecheck and test suite,
# and deploys only if they pass. Nothing is merged into this repository, so there is nothing to
# conflict. See FORK.md.

on:
  schedule:
    - cron: '0 5 * * *' # every day, 05:00 UTC
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream commit, branch or tag to deploy (default: main)"
        required: false
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out upstream CVAurum
        uses: actions/checkout@v4
        with:
          repository: akhil-dara/cvaurum
          ref: ${{ inputs.ref || 'main' }}

      - name: Record the upstream commit
        run: |
          echo "### Deploying akhil-dara/cvaurum @ $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='%ad · %s' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and test (upstream's own gate)
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build:nocheck

      - name: Custom domain
        run: echo "cv.hirepotential.co.uk" > dist/CNAME

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Separate from the deploy so a header change never blocks it; a failure here emails you.
  # GitHub Pages ignores upstream's _headers, so ours come from a Cloudflare rule (FORK.md).
  headers:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository (the checker and expected headers)
        uses: actions/checkout@v4

      - name: Check out upstream's _headers
        uses: actions/checkout@v4
        with:
          repository: akhil-dara/cvaurum
          ref: ${{ inputs.ref || 'main' }}
          path: upstream
          sparse-checkout: public/_headers
          sparse-checkout-cone-mode: false

      - name: Compare security headers
        run: .github/headers/check.sh upstream/public/_headers
